spring.application.name=anime-manga-notification
spring.datasource.url=jdbc:postgresql://localhost:5432/anime_manga_db
spring.datasource.username=tu_usuario_postgres
spring.datasource.password=tu_contraseña_postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Estrategia de actualización del esquema: 'update' crea o modifica tablas sin borrar datos existentes
spring.jpa.hibernate.ddl-auto=update

# Dialecto explícito para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Muestra el SQL generado en la consola para depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true